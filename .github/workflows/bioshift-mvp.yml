name: BioShift MVP CI

on:
  push:
    paths:
      - "mvp/**"
      - ".github/workflows/bioshift-mvp.yml"
  pull_request:
    paths:
      - "mvp/**"
      - ".github/workflows/bioshift-mvp.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Check API syntax
        run: node --check server/index.cjs
      - name: Build frontend
        run: npm run build
